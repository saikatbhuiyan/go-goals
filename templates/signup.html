<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - goals</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="/" class="logo-link">goals (beta)</a>
            </div>
            <div class="auth-buttons">
                <a href="/auth/signin">Sign In</a>
            </div>
        </nav>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <h1>Create Account</h1>
            {{if .ErrorMessage}}
                <p class="error-message">{{.ErrorMessage}}</p>
            {{end}}
            <form action="/auth/signup" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{.Email}}" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{.Username}}" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="display_name">Display Name</label>
                    <input type="text" id="display_name" name="display_name" value="{{.DisplayName}}" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
                </div>

                <button type="submit" class="submit-button">Create Account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="/auth/signin">Sign in</a></p>
        </section>
    </main>
</body>
</html>
