name: build-and-deploy

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '109684670544' }}
  API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY || 'go-goals-api' }}
  DOCKER_PLATFORM: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - uses: docker/setup-buildx-action@v3

      - run: make build-api

      - run: make build-image BUILD_IMAGE=go-goals-api

  test:
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://postgres:password@localhost:5434/postgres?sslmode=disable
      GOOSE_DBSTRING: postgresql://postgres:password@localhost:5434/postgres?sslmode=disable
      GOOSE_DRIVER: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm --prefix apps/web ci

      - run: make up

      - run: make migrate-validate

      - run: make migrate-up

      - run: make migrate-status

      - run: make test-api

      - run: make lint-web

      - run: make build-web

      - if: always()
        run: make down

  deploy:
    if: github.ref == 'refs/heads/master'
    needs:
      - test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-lock
      cancel-in-progress: false
    env:
      BUILD_TAG: production
      GOOSE_DBSTRING: ${{ secrets.GOOSE_DBSTRING }}
      GOOSE_DRIVER: ${{ vars.GOOSE_DRIVER || 'postgres' }}
      RDS_SECURITY_GROUP_ID: ${{ secrets.RDS_SECURITY_GROUP_ID || vars.RDS_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - run: make build-image-push

      - run: make migrate-validate

      - name: Require RDS security group
        run: |
          test -n "$RDS_SECURITY_GROUP_ID" || {
            echo "RDS_SECURITY_GROUP_ID is required so this GitHub-hosted runner can be temporarily allowed to reach PostgreSQL."
            exit 1
          }

      - name: Capture runner public IP
        id: runner-ip
        run: echo "cidr=$(curl -s https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Allow runner to reach RDS
        run: |
          set +e
          output=$(aws ec2 authorize-security-group-ingress \
            --group-id "$RDS_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 5432 \
            --cidr "${{ steps.runner-ip.outputs.cidr }}" 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 0 ] && ! echo "$output" | grep -q "InvalidPermission.Duplicate"; then
            echo "$output"
            exit "$status"
          fi

      - run: make migrate-up

      - name: Revoke runner RDS access
        if: always() && env.RDS_SECURITY_GROUP_ID != '' && steps.runner-ip.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$RDS_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 5432 \
            --cidr "${{ steps.runner-ip.outputs.cidr }}" || true

      - run: make build-image-promote
