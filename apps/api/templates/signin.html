<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - goals</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="/" class="logo-link">goals (beta)</a>
            </div>
            <div class="auth-buttons">
                <a href="/auth/signup">Sign Up</a>
            </div>
        </nav>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <h1>Sign In</h1>
            {{if .ErrorMessage}}
                <p class="error-message">{{.ErrorMessage}}</p>
            {{end}}
            <form action="/auth/signin" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{.Email}}" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="submit-button">Sign In</button>
            </form>
            <p class="auth-switch">New here? <a href="/auth/signup">Create an account</a></p>
        </section>
    </main>
</body>
</html>
